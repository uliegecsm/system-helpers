name: Test

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main
    release:
        types: [published]

concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

    test:
        runs-on: ubuntu-latest
        strategy:
            matrix:
                version: ['3.10', '3.11', '3.12', '3.13', '3.14']
            fail-fast: false
        container:
            image: python:${{ matrix.version }}
        steps:
            - uses: actions/checkout@v7

            - name: Install dependencies.
              run : |
                python -m pip install typeguard -r requirements/requirements.python.test.txt

            - name: Run tests.
              run : |
                python -m pytest tests -s --log-cli-level=info

    build-package-sdist:
        needs: [test]
        runs-on: ubuntu-latest
        container:
            image: python:3.14
        steps:
            - uses: actions/checkout@v7
            - run: python -m pip install -U build
            - run: python -m build --sdist
            - uses: actions/upload-artifact@v7
              with:
                  name: package-sdist
                  path: dist/
                  retention-days: 1

    install-as-package-and-test:
        needs: [build-package-sdist]
        runs-on: [ubuntu-latest]
        strategy:
            matrix:
                version: ['3.10', '3.11', '3.12', '3.13', '3.14']
            fail-fast: false
        container:
            image: python:${{ matrix.version }}
        steps:
            - uses: actions/download-artifact@v8
              with:
                  name: package-sdist
                  path: dist/

            - run: python -m pip install dist/*.gz

            - name: Test 'apt' helpers CLI directly.
              run : |
                  apt-helpers install-packages --update --clean --upgrade --packages jq
                  jq --version

                  test 0 -eq $(ls -all /var/cache/apt/archives/ | grep calc | wc -l)
                  apt-helpers install-packages --update --packages calc --args --download-only --reinstall
                  test 1 -le $(ls -all /var/cache/apt/archives/ | grep calc | wc -l)

                  apt-helpers clean

            - name: Test 'update-alternatives' helpers CLI directly.
              run : |
                  update-alternatives-helpers --help

            - name: Check that we can import packages in Python.
              run : |
                  python -c "from system_helpers.apt                 import install      as u;print(u)"
                  python -c "from system_helpers.update_alternatives import alternatives as u;print(u)"

    build-documentation:
        runs-on: [ubuntu-latest]
        container:
            image: python:3.14
        steps:
            - uses: actions/checkout@v7

            - run: python -m pip install typeguard -r requirements/requirements.python.doc.txt

            - run: cd docs && make html

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: docs/build/html

    # Following instructions from
    # https://packaging.python.org/en/latest/guides/publishing-package-distribution-releases-using-github-actions-ci-cd-workflows/#publishing-the-distribution-to-pypi.
    publish-to-pypi:
        needs: [install-as-package-and-test, build-documentation, build-package-sdist]
        runs-on: [ubuntu-latest]

        if: github.event_name == 'release' && github.event.action == 'published'

        environment:
            name: pypi
            url: https://pypi.org/p/system-helpers

        permissions:
            id-token: write

        steps:
            - run: echo '${{ toJSON(github.event) }}'
            - uses: actions/download-artifact@v8
              with:
                  name: package-sdist
                  path: dist/
            - uses: pypa/gh-action-pypi-publish@release/v1
              with:
                  verbose: true

    deploy:
        needs: [build-documentation]
        runs-on: [ubuntu-latest]

        if: ${{ github.ref == 'refs/heads/main' }}

        permissions:
            pages   : write
            id-token: write

        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}

        steps:
            - id  : deployment
              uses: actions/deploy-pages@v5
